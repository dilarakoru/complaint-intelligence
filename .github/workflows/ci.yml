name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research/semantic_ablation.py research/feature_engineer.py research/model_trainer.py research/explainability.py research/run_pipeline.py
      - run: python -m unittest discover -s tests -v
